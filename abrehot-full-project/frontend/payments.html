<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Payments | Abrehot Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background: #f4f6f8; color: #1f2933; }
        header { background: #1a3c6e; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        header h1 { font-size: 20px; }
        header a { color: #d6eaf8; font-size: 14px; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .panel { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 16px; margin-bottom: 20px; }
        .connect { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
        input[type=text], input[type=password] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { padding: 10px 18px; border: 0; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; background: #1a3c6e; color: #fff; }
        button:hover { background: #15325a; }
        button:disabled { opacity: .6; cursor: wait; }
        .btn-approve { background: #2e8b57; }
        .btn-approve:hover { background: #256f46; }
        .btn-reject { background: #c0392b; }
        .btn-reject:hover { background: #9c2e22; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab { background: #e3e9f0; color: #1f2933; }
        .tab:hover { background: #d3dce7; }
        .tab.active { background: #1a3c6e; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .card h3 { font-size: 16px; color: #1a3c6e; }
        .card p { font-size: 13px; color: #444; }
        .card img.shot { width: 100%; max-height: 260px; object-fit: contain; background: #f0f3f6; border-radius: 6px; cursor: zoom-in; }
        .noshot { background: #fdecea; color: #9c2e22; padding: 10px; border-radius: 6px; font-size: 13px; }
        .actions { display: flex; gap: 8px; margin-top: 4px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; }
        .badge.pending { background: #fdebd0; color: #a04000; }
        .badge.approved { background: #d5f5e3; color: #1e6b3f; }
        .badge.rejected { background: #fadbd8; color: #922b21; }
        .msg { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; display: none; }
        .msg.error { display: block; background: #fdecea; color: #9c2e22; }
        .msg.ok { display: block; background: #d5f5e3; color: #1e6b3f; }
        .empty { text-align: center; color: #666; padding: 40px 0; }
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; cursor: zoom-out; }
        #lightbox.show { display: flex; }
        #lightbox img { max-width: 100%; max-height: 100%; }
        @media (max-width: 700px) { .connect { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <h1>Payment verification</h1>
        <a href="index.html">&larr; Back to admin</a>
    </header>

    <main>
        <div class="panel">
            <div class="connect">
                <div>
                    <label for="apiBase">API address</label>
                    <input type="text" id="apiBase" placeholder="https://api.abrehottutoring.com.et/api">
                </div>
                <div>
                    <label for="secret">Admin secret</label>
                    <input type="password" id="secret" autocomplete="off">
                </div>
                <button id="connectBtn" type="button">Load payments</button>
            </div>
        </div>

        <div class="tabs" id="tabs">
            <button class="tab active" data-status="pending" type="button">Pending <span id="c-pending"></span></button>
            <button class="tab" data-status="approved" type="button">Approved <span id="c-approved"></span></button>
            <button class="tab" data-status="rejected" type="button">Rejected <span id="c-rejected"></span></button>
        </div>

        <div class="msg" id="msg" role="status"></div>
        <div class="grid" id="list"></div>
    </main>

    <div id="lightbox"><img alt="Payment screenshot enlarged"></div>

    <script>
        var apiBaseEl = document.getElementById('apiBase');
        var secretEl = document.getElementById('secret');
        var listEl = document.getElementById('list');
        var msgEl = document.getElementById('msg');
        var currentStatus = 'pending';

        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
        apiBaseEl.value = sessionStorage.getItem('abrehot_admin_api') || (isLocal ? 'http://localhost:5000/api' : 'https://api.abrehottutoring.com.et/api');
        secretEl.value = sessionStorage.getItem('abrehot_admin_secret') || '';

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function showMsg(text, ok) {
            msgEl.textContent = text || '';
            msgEl.className = 'msg' + (text ? (ok ? ' ok' : ' error') : '');
        }

        async function api(path, options) {
            options = options || {};
            var base = apiBaseEl.value.trim().replace(/\/+$/, '');
            var res = await fetch(base + '/admin/payments' + path, {
                method: options.method || 'GET',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': secretEl.value },
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            var data = await res.json().catch(function () { return {}; });
            if (!res.ok) throw new Error(data.message || ('Request failed (' + res.status + ')'));
            return data;
        }

        function cardHtml(b) {
            var parent = b.requestedBy || {};
            var tutor = b.tutor || {};
            var when = b.date ? new Date(b.date).toLocaleDateString() : '-';
            var status = b.paymentStatus || 'pending';
            return '<div class="card">'
                + '<div><span class="badge ' + esc(status) + '">' + esc(status) + '</span></div>'
                + '<h3>' + esc(parent.fullname || 'Unknown user') + ' &rarr; ' + esc(tutor.fullname || 'Tutor') + '</h3>'
                + '<p><strong>Contact:</strong> ' + esc(parent.phone || '-') + ' &middot; ' + esc(parent.email || '-') + '</p>'
                + (b.child ? '<p><strong>Child:</strong> ' + esc(b.child.name) + (b.child.grade ? ' (' + esc(b.child.grade) + ')' : '') + '</p>' : '')
                + '<p><strong>Package:</strong> ' + esc(b.packageId || '-') + (b.packageClassSize ? ' (' + esc(b.packageClassSize) + ')' : '') + '</p>'
                + '<p><strong>Session:</strong> ' + esc((b.subject || []).join(', ')) + ' &middot; ' + esc(when) + ' ' + esc(b.time || '') + ' &middot; ' + esc(b.duration || '') + '</p>'
                + '<p><strong>Method:</strong> ' + esc(b.paymentMethod || '-') + ' &nbsp; <strong>Ref:</strong> ' + esc(b.transactionId || '-') + '</p>'
                + (b.paymentNote ? '<p><strong>Note:</strong> ' + esc(b.paymentNote) + '</p>' : '')
                + (b.paymentScreenshot
                    ? '<img class="shot" src="' + b.paymentScreenshot + '" alt="Payment screenshot">'
                    : '<div class="noshot">No screenshot was saved for this booking.</div>')
                + '<div class="actions">'
                + (status !== 'approved' ? '<button class="btn-approve" data-act="approve" data-id="' + esc(b._id) + '" type="button">Approve</button>' : '')
                + (status !== 'rejected' ? '<button class="btn-reject" data-act="reject" data-id="' + esc(b._id) + '" type="button">Reject</button>' : '')
                + '</div>'
                + '</div>';
        }

        async function load() {
            showMsg('');
            listEl.innerHTML = '<div class="empty">Loading...</div>';
            try {
                var results = await Promise.all([api('?status=' + currentStatus), api('/counts')]);
                var items = results[0], counts = results[1];
                ['pending', 'approved', 'rejected'].forEach(function (k) {
                    document.getElementById('c-' + k).textContent = '(' + (counts[k] || 0) + ')';
                });
                listEl.innerHTML = items.length
                    ? items.map(cardHtml).join('')
                    : '<div class="empty" style="grid-column:1/-1;">No ' + esc(currentStatus) + ' payments.</div>';
            } catch (err) {
                listEl.innerHTML = '';
                showMsg(err.message, false);
            }
        }

        document.getElementById('connectBtn').addEventListener('click', function () {
            sessionStorage.setItem('abrehot_admin_api', apiBaseEl.value.trim());
            sessionStorage.setItem('abrehot_admin_secret', secretEl.value);
            load();
        });

        document.getElementById('tabs').addEventListener('click', function (e) {
            var tab = e.target.closest('.tab');
            if (!tab) return;
            document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
            tab.classList.add('active');
            currentStatus = tab.getAttribute('data-status');
            load();
        });

        listEl.addEventListener('click', async function (e) {
            var img = e.target.closest('img.shot');
            if (img) {
                var box = document.getElementById('lightbox');
                box.querySelector('img').src = img.src;
                box.classList.add('show');
                return;
            }
            var btn = e.target.closest('button[data-act]');
            if (!btn) return;
            var action = btn.getAttribute('data-act');
            var note;
            if (action === 'reject') {
                note = prompt('Reason for rejecting this payment? (the user will see this)');
                if (!note || !note.trim()) return;
            } else if (!confirm('Approve this payment? The tutor and student will be able to chat.')) {
                return;
            }
            btn.disabled = true;
            try {
                await api('/' + btn.getAttribute('data-id'), { method: 'PATCH', body: { action: action, note: note } });
                showMsg(action === 'approve' ? 'Payment approved.' : 'Payment rejected.', true);
                load();
                setTimeout(function () { /* keep the success message visible after reload */ showMsg(action === 'approve' ? 'Payment approved.' : 'Payment rejected.', true); }, 300);
            } catch (err) {
                btn.disabled = false;
                showMsg(err.message, false);
            }
        });

        document.getElementById('lightbox').addEventListener('click', function () { this.classList.remove('show'); });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('show');
        });

        if (secretEl.value) load();
    </script>
</body>
</html>
