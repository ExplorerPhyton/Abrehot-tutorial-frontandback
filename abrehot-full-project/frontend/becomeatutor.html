<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <title>Become A Tutor | Abrehot Online Tutors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #1A5276;
            --primary-dark: #15425F;
            --secondary: #2980B9;
            --secondary-light: #5499C7;
            --accent: #85C1E9;
            --primary-light: #AED6F1;
            --success: #2E8B57;
            --warning: #E67E22;
            --danger: #C0392B;
            --background: #F4F9FC;
            --surface: #FFFFFF;
            --text: #1F2933;
            --text-secondary: #5F6B7A;
            --border: #D6EAF8;
            --shadow: 0 4px 12px rgba(26, 82, 118, .15);
            --radius: 10px;
            --transition: .3s ease;

        }

        .header {
            position: sticky;
            top: 0;
            background-color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            z-index: 1005;
            width: auto;
            color: white;
        }

        .header button {

            color: white;
            background-color: var(--primary);
            border-radius: 5px;
            padding: 10px 20px;
            border: none;
            font-weight: 500;
        }

        .header button:hover {
            transition: var(--transition);
            background-color: var(--primary-dark);
        }

        .head {
            font-size: 20px;
            color: white;
        }

        .right-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 0;

        }

        .right-header img {
            border-radius: 50%;
            border: none;
            width: 75px;
            height: 75px;
        }

        .right-header button {
            width: 60px;
        }

        #menuBtn {
            font-size: 40px;
            border: none;
            background: none;
            cursor: pointer;
            z-index: 1002;
        }

        #google_translate_element {
            padding: 16px 0px 16px 65px;
            background-color: var(--primary);
        }

        .ver-nav {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 24px;
            position: fixed;
            top: 0;
            left: -324px;
            width: 225px;
            height: 92vh;
            box-sizing: content-box;
            background-color: var(--secondary);
            overflow-y: auto;
            transition: .35s;
            z-index: 1001;
            box-shadow: 4px 0 15px rgba(0, 0, 0, .3);
        }

        .ver-nav.show {
            left: 0;


        }

        .ver-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .ver-nav a {
            display: block;
            text-decoration: none;
            padding: 5px;
            color: white;
        }

        .ver-nav a:hover {
            margin: 0 0 5px 5px;
            background-color: var(--primary-light);
            color: black;
        }

        .ver-nav .bx,
        .search-input-section {
            font-size: 20px;
        }


        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .3);
            opacity: 0;
            visibility: hidden;
            transition: .35s;
            z-index: 1000;
        }

        #overlay.show {
            opacity: 0.7;
            visibility: visible;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: #fff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #666;
        }

        .field-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-column-gap: 20px;

        }

        fieldset {
            min-width: auto;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        legend {
            font-size: larger;
            padding: 0 10px;
            font-weight: 600;
            color: var(--secondary)
        }

        .main-label {
            font-weight: 500;
            margin-bottom: 16px;
            margin-top: 10px;
        }

        select,
        input[type=text],
        input[type=number],
        input[type=tel],
        input[type=email],
        input[type=date],
        input[type=date],
        input[type=time],
        textarea {
            max-width: 100%;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input[type=radio],
        input[type=checkbox] {
            margin-right: 5px;
        }

        input[type=text]:focus,
        input[type=number]:focus,
        input[type=tel]:focus,
        input[type=email]:focus,
        input[type=date]:focus,
        input[type=time]:focus,
        textarea:focus {
            border-color: #7e7e7e;
            outline: none;

        }

        .buttons {
            display: flex;
            gap: 15px;
            padding: 10px 0px 20px 0px;
        }

        input[type="submit"],
        input[type=reset] {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            padding: 10px 20px;
            border: none;
            font-weight: 500;
        }

        input[type=reset] {
            background: #ddd;

        }

        input[type="reset"]:hover {
            background: #999;
            transition: var(--transition);
        }

        input[type="submit"] {
            background-color: var(--secondary);
            color: white;
        }

        input[type="submit"]:hover {
            transition: var(--transition);
            background-color: var(--primary-dark);
        }

        .status {
            background: #d5f7ff;
            padding: 25px;
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            margin-top: 25px;
        }

        .status div {
            color: var(--primary);
            font-size: larger;
            font-weight: 600;
            margin-bottom: 10px;
        }

        #applicationStatus {
            font-weight: bold;
            color: #d97706;
        }

        #statusMessage {
            margin-top: 10px;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .footer {
            padding: 32px;
            background-color: rgb(0, 94, 153);
            color: white;

        }

        .footer a {
            color: white;
        }

        .footer-links {
            display: grid;
            align-items: center;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 25px;
        }

        @media (max-width:900px) {
            .header {
                position: static;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                font-size: 18px;
            }

            /*COPY TO EVERY PAGE*/

            .right-header img {
                width: 60px;
                height: 60px;
            }

            /*COPY TO EVERY PAGE*/

            #menuBtn {
                position: sticky;
                top: 0;
                left: 0;
                font-size: 30px;
                z-index: 2;
            }

            /*COPY TO EVERY PAGE*/

            .ver-nav {
                max-width: 150px;
                height: 100vh;
            }
