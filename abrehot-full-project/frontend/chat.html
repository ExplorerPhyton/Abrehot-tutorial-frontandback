<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Chat | Abrehot Online Tutorials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/abrehot-theme.css">
    <style>
        :root { --ink:#173f4d; --teal:#235e65; --coral:#c66b4e; --paper:#e6efe9; --surface:#fffdf9; --muted:#6b7778; --line:#d5e2dc; --chat-bg:#dcebe5; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:var(--paper); color:#24313a; font-family:'DM Sans',sans-serif; }
        .topbar { padding:13px max(22px,5vw); background:var(--ink); color:white; display:flex; align-items:center; justify-content:space-between; gap:16px; }
        .brand { color:white; text-decoration:none; font:700 20px 'Space Grotesk',sans-serif; }
        .back-link { color:#d7e4df; text-decoration:none; font-size:14px; }
        main { width:min(980px,100%); margin:0 auto; }
        .chat-shell { min-height:calc(100vh - 58px); overflow:hidden; background:var(--surface); border-left:1px solid rgba(36,49,58,.1); border-right:1px solid rgba(36,49,58,.1); box-shadow:0 10px 35px rgba(40,50,48,.08); display:flex; flex-direction:column; }
        .chat-heading { padding:15px 24px; border-bottom:1px solid rgba(255,255,255,.12); background:var(--teal); color:white; display:flex; align-items:center; gap:13px; }
        .chat-avatar { width:43px; height:43px; flex:0 0 43px; display:grid; place-items:center; border-radius:50%; background:#d48a63; color:white; font:700 18px 'Space Grotesk',sans-serif; }
        .chat-heading h1 { margin:0; color:white; font:600 19px 'Space Grotesk',sans-serif; }
        .booking-meta { margin:3px 0 0; color:#dcebe5; font-size:12px; }
        .chat-heading .back-link { margin-left:auto; color:#dcebe5; font-size:12px; }
        .messages { flex:1; min-height:480px; max-height:none; overflow-y:auto; padding:28px clamp(18px,5vw,72px); background-color:var(--chat-bg); background-image:radial-gradient(rgba(23,63,77,.08) 1px, transparent 1px); background-size:22px 22px; }
        .empty { color:var(--muted); text-align:center; padding:120px 20px; }
        .message { display:flex; flex-direction:column; align-items:flex-start; max-width:78%; margin:0 0 16px; }
        .message.mine { align-items:flex-end; margin-left:auto; }
        .message-head { color:var(--muted); font-size:11px; margin:0 0 4px 6px; }
        .message.mine .message-head { text-align:right; margin:0 4px 5px 0; }
        .bubble { padding:10px 13px; border-radius:13px 13px 13px 4px; background:rgba(255,255,255,.94); border:1px solid rgba(213,226,220,.9); line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(23,63,77,.08); }
        .message.mine .bubble { color:white; background:var(--teal); border-color:var(--teal); border-radius:13px 13px 4px 13px; box-shadow:0 2px 5px rgba(35,94,101,.2); }
        .reply-preview { display:none; margin:0; padding:10px 28px; border-left:3px solid var(--coral); background:#f7eee7; color:var(--muted); font-size:13px; }
        .reply-preview.show { display:flex; justify-content:space-between; gap:10px; }
        .reply-preview button { width:30px; min-height:30px; padding:0; background:transparent; color:var(--coral); font-size:20px; }
        .message-tools { display:flex; gap:3px; margin-top:3px; }
        .message-tools button { width:29px; min-height:27px; padding:0; background:transparent; color:var(--muted); font-size:16px; }
        .message-tools button:hover, .message-tools button.liked { color:var(--coral); }
        .bubble-image { display:block; max-width:260px; max-height:260px; margin-top:8px; border-radius:9px; object-fit:cover; }
        .composer { display:flex; align-items:flex-end; gap:10px; padding:12px 20px 16px; border-top:1px solid var(--line); background:var(--surface); }
        .attach-button { display:grid; place-items:center; width:44px; flex:0 0 44px; padding:0; background:#e7f0ed; color:var(--teal); font-size:21px; }
        .attach-button:hover { background:#d4e4df; color:var(--ink); }
        #imageInput { display:none; }
        .attachment-name { align-self:center; max-width:140px; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
        textarea { flex:1; min-height:44px; max-height:130px; resize:vertical; padding:12px 14px; font:inherit; border:1px solid #c5d5ce; border-radius:22px; background:white; color:#24313a; }
        button { border:0; border-radius:9px; padding:0 20px; min-height:44px; background:var(--coral); color:white; font:600 14px 'DM Sans',sans-serif; cursor:pointer; }
        .send-button { display:grid; place-items:center; width:44px; flex:0 0 44px; padding:0; border-radius:50%; font-size:21px; }
        .message-tools button,
        .attach-button,
        .reply-preview button {
            background:transparent !important;
            color:var(--muted);
            box-shadow:none;
        }
        .message-tools button:hover,
        .message-tools button.liked,
        .attach-button:hover,
        .reply-preview button:hover {
            background:transparent !important;
            color:var(--coral);
        }
        .send-button { background:transparent !important; color:var(--teal); }
        .send-button:hover { background:transparent !important; color:var(--coral); }
        button:hover { background:#a9513a; } button:disabled { cursor:wait; opacity:.6; }
        .status { min-height:22px; padding:7px 28px 0; color:#b04736; background:var(--surface); font-size:13px; }
        [data-theme="dark"] body { background:#16130f; color:var(--text); }
        [data-theme="dark"] .chat-shell, [data-theme="dark"] .bubble, [data-theme="dark"] textarea { background:var(--surface); color:var(--text); }
        [data-theme="dark"] .messages { background:#211c17; background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); }
        @media (max-width:600px) { .topbar{padding:12px 16px}.chat-heading{padding:13px 16px}.chat-heading .back-link{font-size:0}.chat-heading .back-link:after{content:'Back';font-size:12px}.messages{padding:24px 12px}.composer{padding:10px 10px 12px}.reply-preview{padding:10px 16px}.message{max-width:88%}.attachment-name{max-width:80px} }
    </style>
</head>
<body>
    <header class="topbar"><a class="brand" href="index.html">Abrehot</a></header>
    <main>
        <section class="chat-shell" aria-labelledby="chatTitle">
            <div class="chat-heading"><div class="chat-avatar" aria-hidden="true">A</div><div><h1 id="chatTitle">Tutor conversation</h1><p class="booking-meta" id="bookingMeta">Loading booking...</p></div><a class="back-link" id="backLink" href="index.html">Back</a></div>
            <div class="messages" id="messages" aria-live="polite"><p class="empty">Loading messages...</p></div>
            <p class="status" id="status" role="status"></p>
            <div class="reply-preview" id="replyPreview"><span id="replyText"></span><button type="button" id="cancelReply" aria-label="Cancel reply">&times;</button></div>
            <form class="composer" id="composer">
                <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
                <button class="attach-button" id="attachButton" type="button" aria-label="Attach image" title="Attach image"><i class="bx bx-image-add" aria-hidden="true"></i></button>
                <span class="attachment-name" id="attachmentName"></span>
                <textarea id="messageInput" maxlength="2000" placeholder="Write a message..."></textarea>
                <button class="send-button" id="sendButton" type="submit" aria-label="Send message" title="Send message"><i class="bx bx-send" aria-hidden="true"></i></button>
            </form>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script>
        (function () {
            var bookingId = new URLSearchParams(location.search).get('bookingId');
            var messagesEl = document.getElementById('messages');
            var statusEl = document.getElementById('status');
            var input = document.getElementById('messageInput');
            var sendButton = document.getElementById('sendButton');
            var imageInput = document.getElementById('imageInput');
            var attachmentName = document.getElementById('attachmentName');
            var replyPreview = document.getElementById('replyPreview');
            var replyText = document.getElementById('replyText');
            var currentUser = getUser();
            var selectedImage = '';
            var replyTo = null;
            function status(text) { statusEl.textContent = text || ''; }
            function dateText(value) { var date = new Date(value); return isNaN(date.getTime()) ? '' : date.toLocaleString([], { dateStyle:'medium', timeStyle:'short' }); }
            function render(messages) {
                messagesEl.textContent = '';
                if (!messages.length) { messagesEl.innerHTML = '<p class="empty">No messages yet. Start the conversation.</p>'; return; }
                messages.forEach(function (message) {
                    var currentUserId = currentUser && (currentUser.id || currentUser._id);
                    var mine = currentUserId && message.sender && String(message.sender._id) === String(currentUserId);
                    var item = document.createElement('article'); item.className = 'message' + (mine ? ' mine' : '');
                    var head = document.createElement('p'); head.className = 'message-head'; head.textContent = (message.sender && message.sender.fullname || 'Participant') + ' · ' + dateText(message.createdAt);
                    var bubble = document.createElement('div'); bubble.className = 'bubble';
                    if (message.replyTo) {
                        var quoted = document.createElement('div');
                        quoted.style.cssText = 'border-left:3px solid var(--coral);padding-left:8px;margin-bottom:8px;opacity:.8;font-size:12px;';
                        quoted.textContent = message.replyTo.body || 'Image';
                        bubble.appendChild(quoted);
                    }
                    if (message.body) {
                        var body = document.createElement('div'); body.textContent = message.body; bubble.appendChild(body);
                    }
                    if (message.imageUrl) {
                        var image = document.createElement('img'); image.className = 'bubble-image'; image.src = message.imageUrl; image.alt = 'Attached image'; bubble.appendChild(image);
                    }
                    item.appendChild(head); item.appendChild(bubble); messagesEl.appendChild(item);
                    var tools = document.createElement('div'); tools.className = 'message-tools';
                    var like = document.createElement('button'); like.type = 'button'; like.className = (message.likes || []).some(function (id) { return String(id) === String(currentUserId); }) ? 'liked' : '';
                    like.innerHTML = '<i class="bx bx-heart" aria-hidden="true"></i>'; like.title = 'Like message'; like.setAttribute('aria-label', 'Like message (' + ((message.likes || []).length || 0) + ')');
                    like.addEventListener('click', async function () {
                        try { await apiRequest('/messages/' + message._id + '/like', { method:'PATCH', auth:true }); await load(); } catch (err) { status(err.message); }
                    });
                    var reply = document.createElement('button'); reply.type = 'button'; reply.innerHTML = '<i class="bx bx-reply" aria-hidden="true"></i>'; reply.title = 'Reply to message'; reply.setAttribute('aria-label', 'Reply to message');
                    reply.addEventListener('click', function () { replyTo = message; replyText.textContent = 'Replying to ' + (message.sender && message.sender.fullname || 'participant') + ': ' + (message.body || 'image'); replyPreview.classList.add('show'); input.focus(); });
                    tools.appendChild(like); tools.appendChild(reply); item.appendChild(tools);
                });
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            async function load() {
                if (!bookingId) { status('This chat link is missing a booking.'); return; }
                try {
                    // Refresh the identity before classifying bubbles as sent or received.
                    currentUser = await apiRequest('/auth/me', { auth:true });
                    var data = await apiRequest('/messages/booking/' + encodeURIComponent(bookingId), { auth:true });
                    document.getElementById('bookingMeta').textContent = (data.booking.subject || []).join(', ') || 'Tutoring session';
                    render(data.messages || []); status('');
                } catch (err) { status(err.message); input.disabled = true; sendButton.disabled = true; }
            }
            document.getElementById('attachButton').addEventListener('click', function () { imageInput.click(); });
            imageInput.addEventListener('change', function () {
                var file = imageInput.files && imageInput.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { status('Images must be 2 MB or smaller.'); imageInput.value=''; return; }
                var reader = new FileReader();
                reader.onload = function () { selectedImage = reader.result; attachmentName.textContent = file.name; };
                reader.readAsDataURL(file);
            });
            document.getElementById('cancelReply').addEventListener('click', function () { replyTo=null; replyPreview.classList.remove('show'); });
            document.getElementById('composer').addEventListener('submit', async function (event) {
                event.preventDefault(); var body = input.value.trim(); if ((!body && !selectedImage) || !bookingId) return;
                sendButton.disabled = true;
                try { await apiRequest('/messages/booking/' + encodeURIComponent(bookingId), { method:'POST', auth:true, body:{ body:body, imageUrl:selectedImage || undefined, replyTo:replyTo ? replyTo._id : undefined } }); input.value=''; imageInput.value=''; selectedImage=''; attachmentName.textContent=''; replyTo=null; replyPreview.classList.remove('show'); await load(); }
                catch (err) { status(err.message); }
                finally { sendButton.disabled=false; input.focus(); }
            });
            if (currentUser && currentUser.role === 'Tutor') document.getElementById('backLink').href='dashboards/tutor-dash.html';
            else if (currentUser && currentUser.role === 'Student') document.getElementById('backLink').href='dashboards/student-dash.html';
            else document.getElementById('backLink').href='dashboards/parent-dash.html';
            load(); window.setInterval(load, 5000);
        }());
    </script>
</body>
</html>
