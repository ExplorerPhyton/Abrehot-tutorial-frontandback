<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Abrehot Admin — Moved</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; display: grid; place-items: center; min-height: 100vh; }
        .box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 420px; text-align: center; }
        a { color: #1a3c6e; font-weight: bold; }
    </style>
</head>

<body>
    <div class="box">
        <h1 style="color:#1a3c6e;">Abrehot Admin has moved</h1>
        <p>The admin panel now lives on its own subdomain:</p>
        <p><a href="https://admin.abrehottutoring.com.et/">admin.abrehottutoring.com.et</a></p>
        <p id="localNote" style="display:none; color:#666; font-size:14px;">
            Local development detected — taking you to the local copy instead.
        </p>
    </div>

    <script>
        // Production: the panel is served from its own subdomain.
        // Local dev (Live Server / opened from disk): the subdomain doesn't
        // exist here, so fall back to the bundled local copy.
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
        if (isLocal) {
            document.getElementById('localNote').style.display = '';
            location.replace('admin-site/index.html');
        } else {
            location.replace('https://admin.abrehottutoring.com.et/');
        }
    </script>

</body>

</html>
