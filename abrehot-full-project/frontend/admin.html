<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <title>Abrehot Admin — Tutor Approvals</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; }
        h1 { color: #1a3c6e; }
        #gate { max-width: 400px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #gate input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        #gate button, .card button { background: #1a3c6e; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        #gate button:hover, .card button:hover { background: #14315a; }
        #app { display: none; max-width: 900px; margin: 0 auto; }
        .tabs { margin-bottom: 16px; }
        .tabs button { background: #ddd; color: #333; margin-right: 8px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .tabs button.active { background: #1a3c6e; color: #fff; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .card h3 { margin: 0 0 8px; color: #1a3c6e; }
        .card p { margin: 4px 0; font-size: 14px; }
        .card .actions { margin-top: 12px; }
        .card .actions button { margin-right: 8px; }
        .reject-btn { background: #c0392b !important; }
        .reject-btn:hover { background: #a93226 !important; }
        #message { color: #c0392b; margin-top: 8px; }
        .empty { color: #666; font-style: italic; }
        .ad-form { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .ad-form h3 { margin: 0 0 12px; color: #1a3c6e; }
        .ad-form label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
        .ad-form input, .ad-form textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .ad-form textarea { min-height: 60px; resize: vertical; }
        .ad-form button { margin-top: 14px; }
        .ad-card { display: flex; gap: 14px; }
        .ad-card img { width: 90px; height: 120px; object-fit: cover; border-radius: 4px; background: #eee; flex-shrink: 0; }
        .ad-card .ad-body { flex: 1; }
        .inactive-badge { background: #999; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
    </style>
    <link rel="stylesheet" href="css/abrehot-theme.css">
</head>

<body>

    <div id="gate">
        <h1>Admin Login</h1>
        <p>Enter the admin secret from your backend's <code>.env</code> file.</p>
        <input type="password" id="secretInput" placeholder="Admin secret">
        <button id="unlockBtn">Unlock</button>
        <p id="message"></p>
    </div>

    <div id="app">
        <h1>Abrehot Admin</h1>
        <div class="tabs">
            <button id="tabPending" class="active">Pending Tutors</button>
            <button id="tabApproved">Approved Tutors</button>
            <button id="tabBookings">Bookings</button>
            <button id="tabContact">Contact Messages</button>
            <button id="tabBookAds">Book Ads</button>
            <button id="logoutBtn" style="float:right; background:#888;">Log Out</button>
        </div>
        <div id="content"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        const gate = document.getElementById('gate');
        const app = document.getElementById('app');
        const content = document.getElementById('content');
        const messageEl = document.getElementById('message');

        function getSecret() { return sessionStorage.getItem('abrehot_admin_secret'); }
        function setSecret(s) { sessionStorage.setItem('abrehot_admin_secret', s); }
        function clearSecret() { sessionStorage.removeItem('abrehot_admin_secret'); }

        async function adminRequest(path, options = {}) {
            const res = await fetch(API_BASE + path, {
                method: options.method || 'GET',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': getSecret() },
                body: options.body ? JSON.stringify(options.body) : undefined,
            });
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) throw new Error((data && data.message) || 'Request failed');
            return data;
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        document.getElementById('unlockBtn').addEventListener('click', async function () {
            const secret = document.getElementById('secretInput').value;
            setSecret(secret);
            try {
                await adminRequest('/admin/tutors?status=pending');
                gate.style.display = 'none';
                app.style.display = 'block';
                showTab('pending');
            } catch (err) {
                messageEl.textContent = 'Incorrect secret, or backend not reachable at ' + API_BASE;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function () {
            clearSecret();
            app.style.display = 'none';
            gate.style.display = 'block';
        });

        const tabs = { pending: 'tabPending', approved: 'tabApproved', bookings: 'tabBookings', contact: 'tabContact', bookAds: 'tabBookAds' };
        Object.keys(tabs).forEach(function (key) {
            document.getElementById(tabs[key]).addEventListener('click', function () { showTab(key); });
        });

        function setActiveTab(key) {
            Object.keys(tabs).forEach(function (k) {
                document.getElementById(tabs[k]).classList.toggle('active', k === key);
            });
        }

        async function showTab(key) {
            setActiveTab(key);
            content.innerHTML = '<p>Loading...</p>';
            try {
                if (key === 'pending') await renderTutorList('pending');
                else if (key === 'approved') await renderTutorList('approved');
                else if (key === 'bookings') await renderBookings();
                else if (key === 'contact') await renderContact();
                else if (key === 'bookAds') await renderBookAds();
            } catch (err) {
                content.innerHTML = '<p style="color:#c0392b;">' + escapeHtml(err.message) + '</p>';
            }
        }

        async function renderTutorList(status) {
            const tutors = await adminRequest('/admin/tutors?status=' + status);
            if (!tutors.length) {
                content.innerHTML = '<p class="empty">No ' + status + ' tutors.</p>';
                return;
            }
            content.innerHTML = tutors.map(function (t) {
                return '<div class="card">'
                    + '<h3>' + escapeHtml(t.fullname) + '</h3>'
                    + '<p><strong>Email:</strong> ' + escapeHtml(t.email) + ' &nbsp; <strong>Phone:</strong> ' + escapeHtml(t.phone) + '</p>'
                    + '<p><strong>Subjects:</strong> ' + escapeHtml((t.subjects || []).join(', ')) + '</p>'
                    + '<p><strong>Grades:</strong> ' + escapeHtml((t.grades || []).join(', ')) + '</p>'
                    + '<p><strong>Languages:</strong> ' + escapeHtml((t.languages || []).join(', ')) + '</p>'
                    + '<p><strong>Mode:</strong> ' + escapeHtml(t.mode) + ' &nbsp; <strong>City:</strong> ' + escapeHtml(t.city) + '</p>'
                    + '<p><strong>Education:</strong> ' + escapeHtml(t.education) + ', ' + escapeHtml(t.institution) + '</p>'
                    + '<p><strong>Experience:</strong> ' + escapeHtml(t.experience) + ' &nbsp; <strong>Rate:</strong> ' + escapeHtml(t.price) + ' ETB/hour</p>'
                    + (t.bio ? '<p><strong>Bio:</strong> ' + escapeHtml(t.bio) + '</p>' : '')
                    + '<p><strong>Status:</strong> ' + escapeHtml(t.status) + '</p>'
                    + (status === 'pending'
                        ? '<div class="actions"><button onclick="approveTutor(\'' + t._id + '\')">Approve</button><button class="reject-btn" onclick="rejectTutor(\'' + t._id + '\')">Reject</button></div>'
                        : '')
                    + '</div>';
            }).join('');
        }

        async function approveTutor(id) {
            await adminRequest('/admin/tutors/' + id + '/approve', { method: 'POST' });
            showTab('pending');
        }
        async function rejectTutor(id) {
            await adminRequest('/admin/tutors/' + id + '/reject', { method: 'POST' });
            showTab('pending');
        }

        async function updatePaymentStatus(id, paymentStatus) {
            try {
                await adminRequest('/admin/bookings/' + id + '/payment-status', { method: 'PATCH', body: { paymentStatus: paymentStatus } });
                renderBookings();
            } catch (err) {
                alert('Could not update payment status: ' + err.message);
            }
        }
        window.updatePaymentStatus = updatePaymentStatus;

        async function renderBookings() {
            const bookings = await adminRequest('/admin/bookings');
            if (!bookings.length) {
                content.innerHTML = '<p class="empty">No booking requests yet.</p>';
                return;
            }
            content.innerHTML = bookings.map(function (b) {
                var tutorName = b.tutor && b.tutor.fullname ? b.tutor.fullname : 'Unassigned';
                var payStatus = b.paymentStatus || 'Pending Verification';
                var statusColor = payStatus === 'Verified' ? 'green' : (payStatus === 'Rejected' ? 'red' : '#d97706');
                return '<div class="card">'
                    + '<h3>' + escapeHtml(b.grade) + ' — ' + escapeHtml((b.subject || []).join(', ') || b.otherSubject || 'No subject') + ' (Tutor: ' + escapeHtml(tutorName) + ')</h3>'
                    + '<p><strong>Topic:</strong> ' + escapeHtml(b.topic) + ' &nbsp; <strong>Goal:</strong> ' + escapeHtml((b.goal || []).join(', ')) + '</p>'
                    + '<p><strong>Session:</strong> ' + escapeHtml(b.session) + ' (' + escapeHtml(b.platform || '-') + ') &nbsp; <strong>City:</strong> ' + escapeHtml(b.city || '-') + '</p>'
                    + '<p><strong>Date/Time:</strong> ' + escapeHtml(b.date ? new Date(b.date).toLocaleDateString() : '-') + ' ' + escapeHtml(b.time || '') + ' (' + escapeHtml(b.duration || '-') + ')</p>'
                    + '<p><strong>Payment:</strong> ' + escapeHtml(b.paymentMethod || '-') + ' &nbsp; <strong>Transaction Ref / ID:</strong> ' + escapeHtml(b.transactionId || '-') + ' &nbsp; <strong>Payment Status:</strong> <span style="color:' + statusColor + ';font-weight:700;">' + escapeHtml(payStatus) + '</span></p>'
                    + (b.notes ? '<p><strong>Notes:</strong> ' + escapeHtml(b.notes) + '</p>' : '')
                    + '<p><strong>Session Status:</strong> ' + escapeHtml(b.status) + '</p>'
                    + '<div style="margin-top:10px;">'
                    + '<button onclick="updatePaymentStatus(\'' + b._id + '\', \'Verified\')">Mark Payment Verified</button> '
                    + '<button onclick="updatePaymentStatus(\'' + b._id + '\', \'Rejected\')">Reject Payment</button>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        async function renderContact() {
            const messages = await adminRequest('/admin/contact');
            if (!messages.length) {
                content.innerHTML = '<p class="empty">No contact messages yet.</p>';
                return;
            }
            content.innerHTML = messages.map(function (m) {
                return '<div class="card">'
                    + '<h3>' + escapeHtml(m.subject || 'General') + '</h3>'
                    + (m.name ? '<p><strong>From:</strong> ' + escapeHtml(m.name) + ' (' + escapeHtml(m.email) + ')</p>' : '<p class="empty">Sent by a guest (not logged in)</p>')
                    + '<p>' + escapeHtml(m.message) + '</p>'
                    + (m.rating ? '<p><strong>Rating:</strong> ' + escapeHtml(m.rating) + '</p>' : '')
                    + (m.feedback ? '<p><strong>Feedback:</strong> ' + escapeHtml(m.feedback) + '</p>' : '')
                    + '</div>';
            }).join('');
        }

        // --- Book Ads: the admin's "advertise a book, set a price" section ---

        async function renderBookAds() {
            content.innerHTML = '<p>Loading...</p>';
            const ads = await adminRequest('/admin/book-ads');

            const formHtml =
                '<div class="ad-form">' +
                '<h3>Add a Book Ad</h3>' +
                '<label for="adTitle">Title *</label><input id="adTitle" placeholder="e.g. Grade 12 Physics Workbook">' +
                '<label for="adAuthor">Author</label><input id="adAuthor" placeholder="e.g. Abrehot Publishing">' +
                '<label for="adDescription">Description</label><textarea id="adDescription" placeholder="What is this book about?"></textarea>' +
                '<label for="adPrice">Price (ETB) *</label><input id="adPrice" type="number" min="0" placeholder="e.g. 350">' +
                '<label for="adImageUrl">Cover Image URL</label><input id="adImageUrl" placeholder="images/my-book-cover.jpg or a full https:// link">' +
                '<label for="adBuyLink">Buy Link</label><input id="adBuyLink" placeholder="Telegram link, phone number, or store URL">' +
                '<button id="addAdBtn">Add Ad</button>' +
                '<p id="adFormMessage" style="color:#c0392b; margin-top:8px;"></p>' +
                '</div>';

            const listHtml = !ads.length
                ? '<p class="empty">No book ads yet — add one above.</p>'
                : ads.map(function (ad) {
                    return '<div class="card ad-card">'
                        + (ad.imageUrl ? '<img src="' + escapeHtml(ad.imageUrl) + '" alt="">' : '')
                        + '<div class="ad-body">'
                        + '<h3>' + escapeHtml(ad.title) + (ad.active ? '' : '<span class="inactive-badge">Hidden</span>') + '</h3>'
                        + (ad.author ? '<p><strong>By:</strong> ' + escapeHtml(ad.author) + '</p>' : '')
                        + (ad.description ? '<p>' + escapeHtml(ad.description) + '</p>' : '')
                        + '<p><strong>Price:</strong> ' + escapeHtml(ad.price) + ' ETB</p>'
                        + (ad.buyLink ? '<p><strong>Buy link:</strong> ' + escapeHtml(ad.buyLink) + '</p>' : '')
                        + '<div class="actions">'
                        + '<button onclick="toggleAdActive(\'' + ad._id + '\', ' + !ad.active + ')">' + (ad.active ? 'Hide from site' : 'Show on site') + '</button>'
                        + '<button class="reject-btn" onclick="deleteAd(\'' + ad._id + '\')">Delete</button>'
                        + '</div>'
                        + '</div>'
                        + '</div>';
                }).join('');

            content.innerHTML = formHtml + listHtml;

            document.getElementById('addAdBtn').addEventListener('click', async function () {
                const title = document.getElementById('adTitle').value.trim();
                const price = document.getElementById('adPrice').value;
                const msgEl = document.getElementById('adFormMessage');
                if (!title || !price) {
                    msgEl.textContent = 'Title and price are required.';
                    return;
                }
                try {
                    await adminRequest('/admin/book-ads', {
                        method: 'POST',
                        body: {
                            title,
                            author: document.getElementById('adAuthor').value.trim(),
                            description: document.getElementById('adDescription').value.trim(),
                            price,
                            imageUrl: document.getElementById('adImageUrl').value.trim(),
                            buyLink: document.getElementById('adBuyLink').value.trim(),
                        },
                    });
                    renderBookAds();
                } catch (err) {
                    msgEl.textContent = err.message;
                }
            });
        }

        async function toggleAdActive(id, nextActive) {
            await adminRequest('/admin/book-ads/' + id, { method: 'PATCH', body: { active: nextActive } });
            renderBookAds();
        }

        async function deleteAd(id) {
            if (!confirm('Delete this book ad permanently?')) return;
            await adminRequest('/admin/book-ads/' + id, { method: 'DELETE' });
            renderBookAds();
        }

        // Auto-unlock if we already have a secret from a previous session
        if (getSecret()) {
            document.getElementById('secretInput').value = getSecret();
            document.getElementById('unlockBtn').click();
        }
    </script>

    <script src="js/site-shell.js"></script>
</body>

</html>
