<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <title>Abrehot Admin — Tutor Approvals</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; }
        h1 { color: #1a3c6e; }
        #gate { max-width: 400px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #gate input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        #gate button, .card button { background: #1a3c6e; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        #gate button:hover, .card button:hover { background: #14315a; }
        #app { display: none; max-width: 900px; margin: 0 auto; }
        .tabs { margin-bottom: 16px; }
        .tabs button { background: #ddd; color: #333; margin-right: 8px; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .tabs button.active { background: #1a3c6e; color: #fff; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .card h3 { margin: 0 0 8px; color: #1a3c6e; }
        .card p { margin: 4px 0; font-size: 14px; }
        .card .actions { margin-top: 12px; }
        .card .actions button { margin-right: 8px; }
        .reject-btn { background: #c0392b !important; }
        .reject-btn:hover { background: #a93226 !important; }
        #message { color: #c0392b; margin-top: 8px; }
        .empty { color: #666; font-style: italic; }
    </style>
    <link rel="stylesheet" href="css/abrehot-theme.css">
</head>

<body>

    <div id="gate">
        <h1>Admin Login</h1>
        <p>Enter the admin secret from your backend's <code>.env</code> file.</p>
        <input type="password" id="secretInput" placeholder="Admin secret">
        <button id="unlockBtn">Unlock</button>
        <p id="message"></p>
    </div>

    <div id="app">
        <h1>Abrehot Admin</h1>
        <div class="tabs">
            <button id="tabPending" class="active">Pending Tutors</button>
            <button id="tabApproved">Approved Tutors</button>
            <button id="tabBookings">Bookings</button>
            <button id="tabContact">Contact Messages</button>
            <button id="logoutBtn" style="float:right; background:#888;">Log Out</button>
        </div>
        <div id="content"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        const gate = document.getElementById('gate');
        const app = document.getElementById('app');
        const content = document.getElementById('content');
        const messageEl = document.getElementById('message');

        function getSecret() { return sessionStorage.getItem('abrehot_admin_secret'); }
        function setSecret(s) { sessionStorage.setItem('abrehot_admin_secret', s); }
        function clearSecret() { sessionStorage.removeItem('abrehot_admin_secret'); }

        async function adminRequest(path, options = {}) {
            const res = await fetch(API_BASE + path, {
                method: options.method || 'GET',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': getSecret() },
                body: options.body ? JSON.stringify(options.body) : undefined,
            });
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) throw new Error((data && data.message) || 'Request failed');
            return data;
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        document.getElementById('unlockBtn').addEventListener('click', async function () {
            const secret = document.getElementById('secretInput').value;
            setSecret(secret);
            try {
                await adminRequest('/admin/tutors?status=pending');
                gate.style.display = 'none';
                app.style.display = 'block';
                showTab('pending');
            } catch (err) {
                messageEl.textContent = 'Incorrect secret, or backend not reachable at ' + API_BASE;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function () {
            clearSecret();
            app.style.display = 'none';
            gate.style.display = 'block';
        });

        const tabs = { pending: 'tabPending', approved: 'tabApproved', bookings: 'tabBookings', contact: 'tabContact' };
        Object.keys(tabs).forEach(function (key) {
            document.getElementById(tabs[key]).addEventListener('click', function () { showTab(key); });
        });

        function setActiveTab(key) {
            Object.keys(tabs).forEach(function (k) {
                document.getElementById(tabs[k]).classList.toggle('active', k === key);
            });
        }

        async function showTab(key) {
            setActiveTab(key);
            content.innerHTML = '<p>Loading...</p>';
            try {
                if (key === 'pending') await renderTutorList('pending');
                else if (key === 'approved') await renderTutorList('approved');
                else if (key === 'bookings') await renderBookings();
                else if (key === 'contact') await renderContact();
            } catch (err) {
                content.innerHTML = '<p style="color:#c0392b;">' + escapeHtml(err.message) + '</p>';
            }
        }

        async function renderTutorList(status) {
            const tutors = await adminRequest('/admin/tutors?status=' + status);
            if (!tutors.length) {
                content.innerHTML = '<p class="empty">No ' + status + ' tutors.</p>';
                return;
            }
            content.innerHTML = tutors.map(function (t) {
                return '<div class="card">'
                    + '<h3>' + escapeHtml(t.fullname) + '</h3>'
                    + '<p><strong>Email:</strong> ' + escapeHtml(t.email) + ' &nbsp; <strong>Phone:</strong> ' + escapeHtml(t.phone) + '</p>'
                    + '<p><strong>Subjects:</strong> ' + escapeHtml((t.subjects || []).join(', ')) + '</p>'
                    + '<p><strong>Grades:</strong> ' + escapeHtml((t.grades || []).join(', ')) + '</p>'
                    + '<p><strong>Languages:</strong> ' + escapeHtml((t.languages || []).join(', ')) + '</p>'
                    + '<p><strong>Mode:</strong> ' + escapeHtml(t.mode) + ' &nbsp; <strong>City:</strong> ' + escapeHtml(t.city) + '</p>'
                    + '<p><strong>Education:</strong> ' + escapeHtml(t.education) + ', ' + escapeHtml(t.institution) + '</p>'
                    + '<p><strong>Experience:</strong> ' + escapeHtml(t.experience) + ' &nbsp; <strong>Rate:</strong> ' + escapeHtml(t.price) + ' ETB/hour</p>'
                    + (t.bio ? '<p><strong>Bio:</strong> ' + escapeHtml(t.bio) + '</p>' : '')
                    + '<p><strong>Status:</strong> ' + escapeHtml(t.status) + '</p>'
                    + (status === 'pending'
                        ? '<div class="actions"><button onclick="approveTutor(\'' + t._id + '\')">Approve</button><button class="reject-btn" onclick="rejectTutor(\'' + t._id + '\')">Reject</button></div>'
                        : '')
                    + '</div>';
            }).join('');
        }

        async function approveTutor(id) {
            await adminRequest('/admin/tutors/' + id + '/approve', { method: 'POST' });
            showTab('pending');
        }
        async function rejectTutor(id) {
            await adminRequest('/admin/tutors/' + id + '/reject', { method: 'POST' });
            showTab('pending');
        }

        async function renderBookings() {
            const bookings = await adminRequest('/admin/bookings');
            if (!bookings.length) {
                content.innerHTML = '<p class="empty">No booking requests yet.</p>';
                return;
            }
            content.innerHTML = bookings.map(function (b) {
                return '<div class="card">'
                    + '<h3>' + escapeHtml(b.grade) + ' — ' + escapeHtml((b.subject || []).join(', ') || b.otherSubject || 'No subject') + '</h3>'
                    + '<p><strong>Topic:</strong> ' + escapeHtml(b.topic) + ' &nbsp; <strong>Goal:</strong> ' + escapeHtml((b.goal || []).join(', ')) + '</p>'
                    + '<p><strong>Session:</strong> ' + escapeHtml(b.session) + ' (' + escapeHtml(b.platform) + ') &nbsp; <strong>City:</strong> ' + escapeHtml(b.city) + '</p>'
                    + '<p><strong>Date/Time:</strong> ' + escapeHtml(b.date ? new Date(b.date).toLocaleDateString() : '-') + ' ' + escapeHtml(b.time) + ' (' + escapeHtml(b.duration) + ')</p>'
                    + (b.notes ? '<p><strong>Notes:</strong> ' + escapeHtml(b.notes) + '</p>' : '')
                    + '<p><strong>Status:</strong> ' + escapeHtml(b.status) + '</p>'
                    + '</div>';
            }).join('');
        }

        async function renderContact() {
            const messages = await adminRequest('/admin/contact');
            if (!messages.length) {
                content.innerHTML = '<p class="empty">No contact messages yet.</p>';
                return;
            }
            content.innerHTML = messages.map(function (m) {
                return '<div class="card">'
                    + '<h3>' + escapeHtml(m.subject || 'General') + '</h3>'
                    + (m.name ? '<p><strong>From:</strong> ' + escapeHtml(m.name) + ' (' + escapeHtml(m.email) + ')</p>' : '<p class="empty">Sent by a guest (not logged in)</p>')
                    + '<p>' + escapeHtml(m.message) + '</p>'
                    + (m.rating ? '<p><strong>Rating:</strong> ' + escapeHtml(m.rating) + '</p>' : '')
                    + (m.feedback ? '<p><strong>Feedback:</strong> ' + escapeHtml(m.feedback) + '</p>' : '')
                    + '</div>';
            }).join('');
        }

        // Auto-unlock if we already have a secret from a previous session
        if (getSecret()) {
            document.getElementById('secretInput').value = getSecret();
            document.getElementById('unlockBtn').click();
        }
    </script>

    <script src="js/site-shell.js"></script>
</body>

</html>
