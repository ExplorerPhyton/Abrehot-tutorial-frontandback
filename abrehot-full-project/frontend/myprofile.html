<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Abrehot Online Tutorials</title>
    <link rel="stylesheet" href="css/abrehot-theme.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            background: var(--sand-50, #FAF8F5);
            color: var(--ink-900, #191615);
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        }
    </style>
</head>

<body>
    <!--
        This page used to just show links to all three dashboards and make
        the person pick one manually. Now it looks at who's actually logged
        in and sends them straight to their own dashboard automatically.
    -->
    <p id="redirectMessage">Loading your profile...</p>

    <script src="js/api.js"></script>
    <script>
        var user = getUser();
        var token = getToken();
        var msg = document.getElementById('redirectMessage');

        if (!user || !token) {
            msg.textContent = 'Please log in to view your profile. Redirecting...';
            setTimeout(function () {
                window.location.href = 'login.html';
            }, 1200);
        } else {
            msg.textContent = 'Taking you to your dashboard...';
            window.location.href = dashboardPathForRole(user.role);
        }
    </script>
</body>

</html>
