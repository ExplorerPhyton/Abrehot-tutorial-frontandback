<body>
    <!--AFTER THE USER SIGNS UP OR LOGS IN THEY ARE AUTOMATICALLY TAKEN TO EITHER ONE 
    OF THESE PAGES TO CREATE THEIR PROFILE (AUTOMATICALLY ENTER USER INFORMATION TO 
    CREATE THEIR PROFILE AND PROVIDE A FORM FOR THEM TO UPDATE THEIR PROFILE. FOR EXAMPLE: 
    GARDE, SCHOOL, HOMEWORK AND NOTES FORM FOR STUDENTS... ) TO BE DONE WITH BACKEND 
    AND DATABASE-->

    <script>
        const menu = document.getElementById("menuBtn");
        const nav = document.getElementById("verNav");
        const overlay = document.getElementById("overlay");

        menu.style.transition = 'opacity 2s ease';
        menu.style.opacity = '1';

        function hideMenu() {
            menu.style.opacity = '0';
            setTimeout(() => {
                menu.style.visibility = 'hidden';
            });
        }

        function showMenuSlowly() {
            menu.style.visibility = 'visible';
            menu.style.opacity = '0';
            requestAnimationFrame(() => {
                menu.style.opacity = '1';
            });
        }

        menu.onclick = function () {
            nav.classList.add("show");
            overlay.classList.add("show");
            hideMenu();
        }

        overlay.onclick = function () {
            nav.classList.remove("show");
            overlay.classList.remove("show");
            showMenuSlowly();
        }

        window.onscroll = function () {
            nav.classList.remove("show");
            overlay.classList.remove("show");
            showMenuSlowly();
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                nav.classList.remove("show");
                overlay.classList.remove("show");
                showMenuSlowly();
            }
        });
    </script>
